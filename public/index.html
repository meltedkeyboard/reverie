<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="color-scheme" content="light dark" />
    <title>%WEB_TITLE%</title>
    <!-- The SVG follows the system theme on its own; Expo builds the .ico from web.favicon
         for browsers without SVG icons. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Link previews in messengers and social networks. Most of them need og:image as an
         absolute URL, so put the full address of the deployed site in front of it. -->
    <meta name="description" content="Приватный ролевой чат с персонажами, который говорит с вашей собственной моделью." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Reverie" />
    <meta property="og:description" content="Приватный ролевой чат с персонажами, который говорит с вашей собственной моделью." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Overrides the default Expo template so the page has the theme's background before the bundle loads. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      /* The lists inside the app own the scrolling. */
      body {
        margin: 0;
        overflow: hidden;
        background-color: #f5f5f7;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0f0f12;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      ::selection {
        background-color: rgba(139, 92, 246, 0.35);
      }
    </style>
  </head>

  <body>
    <noscript>Для работы Reverie нужен включённый JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
