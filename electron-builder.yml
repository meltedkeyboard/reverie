appId: reverie.app
productName: Reverie
extraMetadata:
  # package.json's own main is the Expo entry, Electron must start from here
  main: electron/main.js
directories:
  output: release
files:
  - electron/**
  - dist/**
  - package.json
icon: assets/images/icon.png
# Reverie-4.3.0.exe, .dmg, .AppImage, like the .apk and .ipa
artifactName: ${productName}-${version}.${ext}
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.entertainment
linux:
  # The AppImage is one file; the tar.gz holds the unpacked app with its plain `reverie` executable
  target:
    - AppImage
    - tar.gz
  category: Network
