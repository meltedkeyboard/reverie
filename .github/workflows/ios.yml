# Builds an unsigned Reverie.ipa to be signed on the way to the phone with a personal
# Apple ID (Sideloadly, AltStore). Started by hand from the Actions tab, or by pushing
# a v* tag, which also attaches the .ipa to a GitHub release.
name: iOS build 

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The glass UI needs the iOS 26 SDK, so take the newest stable Xcode on the runner.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Generates ios/ from app.json and installs the pods.
      - run: npx expo prebuild --platform ios --clean

      - name: Archive without signing
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=${WORKSPACE%.xcworkspace}
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/app.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify

      # An .ipa is the .app inside a Payload folder, zipped.
      - name: Pack the ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/app.xcarchive/Products/Applications/*.app Payload/
          zip -qry ../Reverie.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Reverie-ipa
          path: Reverie.ipa

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Reverie.ipa
