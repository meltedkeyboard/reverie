# Builds Reverie.apk, signed with the debug key the Expo template ships, which is enough
# to install it on a phone by hand. Started from the Actions tab, or by pushing a v* tag,
# which also attaches the .apk to a GitHub release.
name: Android build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - run: npx expo prebuild --platform android --clean

      - name: Assemble the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - run: cp android/app/build/outputs/apk/release/app-release.apk Reverie.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Reverie-apk
          path: Reverie.apk

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Reverie.apk
